name: CORE CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-baseline:
    name: CORE baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: production
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify pnpm via Corepack
        run: corepack pnpm --version

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify toolchain
        run: |
          node --version
          corepack pnpm --version
          dotnet --version

      - name: Repository whitespace check
        working-directory: .
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
            git diff --check "$base"...HEAD
          else
            before="${{ github.event.before }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              git diff --check "$before" "${{ github.sha }}"
            else
              git diff-tree --check --no-commit-id --root -r "${{ github.sha }}"
            fi
          fi

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build and typecheck CORE
        run: corepack pnpm run check
