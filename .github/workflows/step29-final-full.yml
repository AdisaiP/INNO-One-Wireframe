name: Step29 Final Full Parity Audit

on:
  push:
    branches:
      - qa/step29-final-full

jobs:
  final-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.103'

      - name: Install dependencies
        run: |
          cd production
          pnpm install --frozen-lockfile
          pnpm run build:packages
          python3 -m pip install --user requests websocket-client pillow

      - name: Step 29 static parity audit
        run: python3 step29-react-ui-parity-audit.py

      - name: Step 15-28 regression audits
        shell: bash
        run: |
          set -euo pipefail
          for f in             step15-vertical-slice-audit.py             step16-devices-management-audit.py             step17-helpdesk-core-audit.py             step18-helpdesk-sla-automation-audit.py             step19-assets-core-audit.py             step20-asset-custom-fields-audit.py             step21-asset-qr-audit.py             step22-software-licenses-audit.py             step23-contracts-warranty-audit.py             step24-assets-mobile-audit.py             step25-assets-integration-audit.py             step26-software-baselines-audit.py             step27-devices-software-inventory-audit.py             step28-software-baseline-evaluation-audit.py
          do
            python3 "$f"
          done

      - name: Web typecheck
        working-directory: production
        run: pnpm typecheck

      - name: Web build
        working-directory: production
        run: pnpm build

      - name: .NET build
        working-directory: production
        run: dotnet build INNO.One.sln --nologo

      - name: Start runtime services
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f production/infrastructure/docker/compose.yml up -d postgres keycloak

          for i in {1..60}; do
            if curl -fsS http://localhost:8080/realms/inno-one/.well-known/openid-configuration >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/realms/inno-one/.well-known/openid-configuration >/dev/null

          (
            cd production
            ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5080 MeshCentral__Enabled=false             dotnet run --no-build --project services/platform-api/src/INNO.One.PlatformApi/INNO.One.PlatformApi.csproj
          ) >/tmp/inno-api.log 2>&1 &

          for i in {1..60}; do
            if curl -fsS http://localhost:5080/health/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:5080/health/ready >/dev/null

          (cd production && pnpm --filter @inno/web-portal dev --host 0.0.0.0 --port 5180) >/tmp/inno-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:5180 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:5180 >/dev/null

      - name: Full browser parity regression
        shell: bash
        run: |
          set -euo pipefail

          restart_browser() {
            label="$1"
            route="$2"
            pkill -f 'google-chrome.*remote-debugging-port=9241' >/dev/null 2>&1 || true
            sleep 2
            rm -rf "/tmp/inno-chrome-$label"
            google-chrome --headless=new --no-sandbox --disable-gpu               --remote-debugging-port=9241               --user-data-dir="/tmp/inno-chrome-$label"               "http://localhost:5180$route" >"/tmp/inno-chrome-$label.log" 2>&1 &
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:9241/json >/dev/null 2>&1; then break; fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:9241/json >/dev/null
            python3 production/scripts/step29-browser-login.py
          }

          echo '=== SHELL ==='
          restart_browser shell /devices
          python3 production/scripts/step29-react-shell-browser-qa.py

          echo '=== DEVICES ==='
          restart_browser devices /devices
          python3 production/scripts/step29-devices-parity-browser-qa.py

          echo '=== ASSETS ==='
          restart_browser assets /assets/inventory
          python3 production/scripts/step29-assets-parity-browser-qa.py

          echo '=== HELPDESK ==='
          restart_browser helpdesk /helpdesk
          python3 production/scripts/step29-helpdesk-parity-browser-qa.py

          echo '=== REMAINING ==='
          restart_browser remaining /profile
          python3 production/scripts/step29-remaining-routes-browser-qa.py

          echo '=== VISUAL SESSION ==='
          restart_browser visual /devices

      - name: Capture final visual baseline
        env:
          STEP29_SCREENSHOT_DIR: step29-final-visual
        run: python3 production/scripts/step29-final-visual-capture.py

      - name: Upload visual baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step29-final-visual
          path: step29-final-visual
          if-no-files-found: warn
          retention-days: 7

      - name: Diagnostics
        if: failure()
        run: |
          echo '=== API ==='
          tail -240 /tmp/inno-api.log || true
          echo '=== VITE ==='
          tail -160 /tmp/inno-vite.log || true
          echo '=== CHROME ==='
          tail -160 /tmp/inno-chrome-visual.log || true
          tail -120 /tmp/inno-chrome-remaining.log || true
          docker compose -f production/infrastructure/docker/compose.yml ps || true

      - name: Stop runtime
        if: always()
        run: docker compose -f production/infrastructure/docker/compose.yml down -v || true
