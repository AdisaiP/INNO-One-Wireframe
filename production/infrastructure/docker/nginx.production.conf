server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /health/platform {
        proxy_pass http://platform-api:5080/health/ready;
    }

    location = /health/meeting {
        proxy_pass http://meeting-service:5090/health/ready;
    }

    location = /health/web {
        proxy_pass http://web-portal:80/health;
    }

    location ^~ /api/v1/meeting/ {
        proxy_pass http://meeting-service:5090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /api/ {
        proxy_pass http://platform-api:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location / {
        proxy_pass http://web-portal:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
