name: inno-one-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - production-postgres:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inno} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-inno}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL:-http://172.10.1.58:8180}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/realm-inno-one.json:/opt/keycloak/data/import/realm-inno-one.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  meshcentral:
    image: ghcr.io/ylianst/meshcentral:1.2.6
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DYNAMIC_CONFIG: "true"
      HOSTNAME: ${PUBLIC_HOST:-172.10.1.58}
      PORT: "443"
      REDIR_PORT: "80"
      ALLOW_NEW_ACCOUNTS: "false"
      LOCAL_SESSION_RECORDING: "false"
      WEBRTC: "false"
    ports:
      - "${MESHCENTRAL_PORT:-8445}:443"
    volumes:
      - production-meshcentral-data:/opt/meshcentral/meshcentral-data
      - production-meshcentral-files:/opt/meshcentral/meshcentral-files
      - production-meshcentral-backups:/opt/meshcentral/meshcentral-backups
    healthcheck:
      test: ["CMD", "curl", "-k", "--fail", "https://localhost:443/health.ashx"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 30

  platform-api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.platform-api
    image: inno-one-platform-api:main
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__CoreDatabase: "Host=postgres;Port=5432;Database=inno_core;Username=${POSTGRES_USER:-inno};Password=${POSTGRES_PASSWORD}"
      Authentication__Authority: "${PUBLIC_KEYCLOAK_URL:-http://172.10.1.58:8180}/realms/inno-one"
      Authentication__Audience: inno-one-api
      Authentication__RequireHttpsMetadata: "false"
      Database__ApplyMigrationsOnStartup: "true"
      DevelopmentSeed__Enabled: "false"
      MeshCentral__Enabled: "true"
      MeshCentral__BaseUrl: "${PUBLIC_MESHCENTRAL_WS_URL:-wss://172.10.1.58:8445}"
      MeshCentral__Username: ${MESHCENTRAL_USERNAME:-innoapi}
      MeshCentral__Password: ${MESHCENTRAL_PASSWORD:?MESHCENTRAL_PASSWORD is required}
      MeshCentral__AllowInvalidTls: "true"
      MeshCentral__CommandTimeoutSeconds: "10"
      MeshCentral__SyncIntervalSeconds: "5"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      meshcentral:
        condition: service_healthy

  meeting-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.meeting-service
    image: inno-one-meeting-service:main
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5090
      ConnectionStrings__MeetingDatabase: "Host=postgres;Port=5432;Database=inno_meeting;Username=${POSTGRES_USER:-inno};Password=${POSTGRES_PASSWORD}"
      Authentication__Authority: "${PUBLIC_KEYCLOAK_URL:-http://172.10.1.58:8180}/realms/inno-one"
      Authentication__Audience: inno-one-api
      Authentication__RequireHttpsMetadata: "false"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  web-portal:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web-portal
      args:
        VITE_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://172.10.1.58:8180}
        VITE_KEYCLOAK_REALM: inno-one
        VITE_KEYCLOAK_CLIENT_ID: inno-one-web
        VITE_API_BASE_URL: /api/v1
    image: inno-one-web-portal:main
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-8082}:80"
    volumes:
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-portal
      - platform-api
      - meeting-service

volumes:
  production-postgres:
  production-meshcentral-data:
  production-meshcentral-files:
  production-meshcentral-backups:
