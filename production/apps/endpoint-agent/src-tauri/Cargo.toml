[package]
name = "inno-one-endpoint-agent"
version = "0.1.0"
description = "INNO.One Endpoint Agent native host"
authors = ["Innovations Solutions and Service"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
